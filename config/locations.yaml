  - {id: STR-04, street: "Rambla de Prim", point: [2.2055, 41.4160], vulnerability: medium,
     note: "Follows the former Riera de Horta"}
  - {id: STR-05, street: "Via Augusta", point: [2.1505, 41.3985], vulnerability: low}
  - {id: STR-06, street: "Passeig de la Zona Franca", point: [2.1385, 41.3600], vulnerability: medium}
  - {id: STR-07, street: "Passeig de Colom", point: [2.1795, 41.3775], vulnerability: high,
